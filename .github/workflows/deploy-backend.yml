name: Backend Deployment

on:
  workflow_dispatch:

jobs:
  ci:
    name: Backend CI
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci-backend.yml

  deploy:
    name: VPS deployment
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/containers/DeskClock/backend

            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker-compose.yml -f docker-compose.prod.yml build backend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend npm run migrate:up:prod
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker exec reverse-proxy-deskclock caddy reload --config /etc/caddy/Caddyfile